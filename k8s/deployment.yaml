apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-prod-service
  namespace: oficina-mecanica
  labels:
    app: exec-prod-service
    app.kubernetes.io/name: exec-prod-service
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exec-prod-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: exec-prod-service
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: exec-prod-service
          image: arodri19/oficina-exec-prod-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4200
              name: http
          envFrom:
            - configMapRef:
                name: exec-prod-service-config
            - secretRef:
                name: exec-prod-service-secrets
          readinessProbe:
            httpGet: { path: /health, port: 4200 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "250m", memory: "192Mi" }
