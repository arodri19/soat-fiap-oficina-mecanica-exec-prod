# Ambiente local isolado do exec-prod-service (LocalStack com SQS + DynamoDB).
# Fluxo completo com os 3 microsserviços: docker-compose.yml do os-service.
services:
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - 4566:4566
    volumes:
      - ./local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name oficina-mecanica-dev-executions"]
      interval: 5s
      retries: 30

  exec-prod-service:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - 4200:4200
    environment:
      PORT: 4200
      JWT_SECRET: super-secret-change-me
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      DYNAMODB_ENDPOINT: http://localstack:4566
      NEW_RELIC_ENABLED: "false"
      MAX_ACTIVE_EXECUTIONS: ${MAX_ACTIVE_EXECUTIONS:-10}
